# Everforest dark medium, matching the yazi flavor
gui:
  nerdFontsVersion: "3"
  theme:
    activeBorderColor:
      - "#a7c080"
      - bold
    inactiveBorderColor:
      - "#4f585e"
    optionsTextColor:
      - "#7fbbb3"
    selectedLineBgColor:
      - "#3d484d"
    unstagedChangesColor:
      - "#e67e80"
    defaultFgColor:
      - "#d3c6aa"
customCommands:
  - key: "G"
    description: "AI commit message (Claude)"
    context: "files"
    command: "git-ai-commit"
    output: terminal
