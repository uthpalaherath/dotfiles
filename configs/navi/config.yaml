# Everforest dark medium, matching tmux/yazi/lazygit.
# style colors only take ANSI names, so the hex palette lives in the fzf overrides.

style:
  tag:
    color: green
    width_percentage: 26
    min_width: 20
  comment:
    color: blue
    width_percentage: 42
    min_width: 45
  snippet:
    color: white

finder:
  command: fzf
  overrides: --color=fg:#d3c6aa,hl:#a7c080,fg+:#d3c6aa,bg+:#3d484d,hl+:#a7c080,info:#dbbc7f,prompt:#7fbbb3,pointer:#a7c080,marker:#e69875,spinner:#dbbc7f,header:#859289,border:#4f585e,gutter:-1

client:
  tealdeer: true

shell:
  command: bash
