# Shared starship prompt for zsh (mac) and bash (clusters), colors from honukai
# - Uthpala Herath

add_newline = true
command_timeout = 1000
scan_timeout = 10
palette = "honukai"
format = """
${env_var.VIRTUAL_ENV_PROMPT}$conda$username$hostname$directory$git_branch$git_state$git_status\
${env_var.SLURM_JOB_ID}\
$cmd_duration$status
$character"""

[palettes.honukai]
magenta = "125"
orange = "166"
green = "64"
blue = "61"
gray = "244"
red = "160"
cyan = "37"

[username]
show_always = true
style_user = "fg:magenta"
style_root = "bold fg:red"
format = "[$user]($style) "

[hostname]
ssh_only = false
style = "fg:orange"
format = "[at](fg:gray) [$hostname]($style) "

[directory]
style = "fg:green"
truncation_length = 0
truncate_to_repo = false
read_only = " "
read_only_style = "fg:red"
format = "[in](fg:gray) [$path]($style)[$read_only]($read_only_style) "

[git_branch]
symbol = " "
format = "[on](fg:gray) [$symbol$branch]($style) "
style = "fg:blue"

[git_status]
format = """([$conflicted](fg:red)[$staged](fg:green)[$modified](fg:orange)[$renamed](fg:orange)\
[$deleted](fg:red)[$untracked](fg:gray)[$stashed](fg:blue)[$ahead_behind](fg:magenta))"""
conflicted = " ${count} "
staged = " ${count} "
modified = " ${count} "
renamed = " ${count} "
deleted = " ${count} "
untracked = " ${count} "
stashed = " ${count} "
ahead = "⇡${count} "
behind = "⇣${count} "
diverged = "⇡${ahead_count}⇣${behind_count} "

[env_var.SLURM_JOB_ID]
format = "[job:$env_value](fg:cyan) "

[env_var.VIRTUAL_ENV_PROMPT]
format = '[\($env_value\)](fg:gray) '

[conda]
ignore_base = false
format = '[\($environment\)](fg:gray) '

[cmd_duration]
min_time = 10_000
format = "[took $duration](fg:gray) "

[status]
disabled = false
format = "[ exit $status](fg:red) "

[character]
success_symbol = "[\\$](fg:gray)"
error_symbol = "[\\$](fg:red)"
