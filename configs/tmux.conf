# ~/.config/tmux/tmux.conf
# Standalone config. Needs tmux 3.4+ and a Nerd Font.

# -- general -------------------------------------------------------------------

set -g prefix2 C-a
bind C-a send-prefix -2
bind -n C-q send-prefix

set -s escape-time 10
set -s focus-events on
set -s extended-keys on
set -s extended-keys-format csi-u
set -as terminal-features ',*256col*:RGB'
set -ga terminal-overrides '*:Ss=\E[%p1%d q:Se=\E[ q'

set -g history-limit 10000
set -g status-keys vi
set -g mode-keys vi
set -g bell-action none
set -g visual-bell off
set -g allow-passthrough on
set -ga update-environment TERM
set -ga update-environment TERM_PROGRAM

set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
set -g detach-on-destroy off
setw -g aggressive-resize on
setw -g monitor-activity on
set -g set-titles on
set -g set-titles-string '#h ❐ #S ● #I #W'

set -g display-panes-time 800
set -g display-time 1000
set -g repeat-time 600
set -g status-interval 10

# -- clipboard -----------------------------------------------------------------

set -s set-clipboard on
set -s copy-command 'pbcopy'

# -- bindings ------------------------------------------------------------------

bind r source-file ~/.config/tmux/tmux.conf \; display 'Configuration reloaded'
bind e new-window -n tmux.conf '${EDITOR:-vim} ~/.config/tmux/tmux.conf && tmux source ~/.config/tmux/tmux.conf && tmux display "Configuration reloaded"'

bind C-c new-session
bind C-f command-prompt -p find-session 'switch-client -t %%'
bind BTab switch-client -l
bind X confirm-before kill-session
bind m set -g mouse \; display 'mouse #{?mouse,on,off}'

bind c new-window -c '#{pane_current_path}'
bind '"' split-window -v -c '#{pane_current_path}'
bind % split-window -h -c '#{pane_current_path}'
bind - if -F '#{window_zoomed_flag}' 'resize-pane -Z' "split-window -v -c '#{pane_current_path}'"
bind \\ if -F '#{window_zoomed_flag}' 'resize-pane -Z' "split-window -h -c '#{pane_current_path}'"

bind -r h select-pane -L
bind -r j select-pane -D
bind -r k select-pane -U
bind -r l select-pane -R
bind -r H resize-pane -L 2
bind -r J resize-pane -D 2
bind -r K resize-pane -U 2
bind -r L resize-pane -R 2
bind > swap-pane -D
bind < swap-pane -U

unbind n
unbind p
bind -r C-h previous-window
bind -r C-l next-window
bind Tab last-window
bind 0 select-window -t :=10
bind -r C-S-H swap-window -t -1 \; select-window -t -1
bind -r C-S-L swap-window -t +1 \; select-window -t +1
bind S-Left swap-window -t -1 \; select-window -t -1
bind S-Right swap-window -t +1 \; select-window -t +1

bind -n C-l send-keys C-l \; run 'sleep 0.2' \; clear-history

bind Enter copy-mode
bind b list-buffers
bind p paste-buffer -p
bind P choose-buffer
bind y run -b 'tmux save-buffer - | pbcopy'
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi y send -X copy-pipe-and-cancel
bind -T copy-mode-vi Escape send -X cancel
bind -T copy-mode-vi H send -X start-of-line
bind -T copy-mode-vi L send -X end-of-line

# popups: scratch shell, file manager, process viewer, session switcher
bind ` display-popup -E -w 80% -h 80% -d '#{pane_current_path}'
bind F display-popup -E -w 90% -h 90% -d '#{pane_current_path}' yazi
bind T display-popup -E -w 90% -h 90% htop
bind S display-popup -E -w 60% -h 50% "tmux list-sessions -F '#S' | fzf --reverse --prompt 'session> ' | xargs -r tmux switch-client -t"

# -- theme ---------------------------------------------------------------------
# Pick a palette: everforest (matches yazi) or gruvbox (matches vim).
theme=everforest

%if "#{==:$theme,gruvbox}"
pill_fg='#282828'
bg1='#3c3836'
bg2='#504945'
gray='#928374'
fg4='#a89984'
fg='#ebdbb2'
c_session='#fe8019'
c_window='#83a598'
c_host='#b8bb26'
c_attn='#fabd2f'
c_alert='#fb4934'
%elif "#{==:$theme,everforest}"
pill_fg='#2d353b'
bg1='#3d484d'
bg2='#4f585e'
gray='#859289'
fg4='#9da9a0'
fg='#d3c6aa'
c_session='#7fbbb3'
c_window='#a7c080'
c_host='#e69875'
c_attn='#dbbc7f'
c_alert='#e67e80'
%endif

lc=''  # U+E0B6
rc=''  # U+E0B4

set -g status-position top
set -g status-justify left
set -g status-style "bg=default,fg=$fg"
set -g status-left-length 60
set -g status-right-length 120

# session pill turns yellow while the prefix is held
set -g status-left "#[fg=#{?client_prefix,$c_attn,$c_session},bg=default]$lc#[fg=$pill_fg,bg=#{?client_prefix,$c_attn,$c_session},bold] #S#[fg=#{?client_prefix,$c_attn,$c_session},bg=default,nobold]$rc  "

setw -g window-status-separator ' '
setw -g window-status-format "#[fg=$bg1,bg=default]$lc#[fg=$fg4,bg=$bg1]#I #W#{?window_zoomed_flag, 󰁌,}#{?window_activity_flag, 󱅫,}#[fg=$bg1,bg=default]$rc"
setw -g window-status-current-format "#[fg=$c_window,bg=default]$lc#[fg=$pill_fg,bg=$c_window,bold]#I #W#{?window_zoomed_flag, 󰁌,}#[fg=$c_window,bg=default,nobold]$rc"
set -g status-left-style default
set -g status-right-style default
setw -g window-status-style default
setw -g window-status-current-style default
setw -g window-status-last-style default
setw -g window-style default
setw -g window-status-activity-style 'none'
setw -g window-status-bell-style "fg=$c_alert"

set -g status-right "#{?pane_synchronized,#[fg=$c_alert]$lc#[fg=$pill_fg#,bg=$c_alert]sync#[fg=$c_alert#,bg=default]$rc ,}#{?mouse,#[fg=$gray]󰍽 ,}#[fg=$c_host,bg=default]$lc#[fg=$pill_fg,bg=$c_host] #[fg=$fg,bg=$bg1] #{client_user}@#h#[fg=$bg1,bg=default]$rc "

set -g pane-border-lines single
set -g pane-border-style "fg=$bg1"
set -g pane-active-border-style "#{?pane_in_mode,fg=$c_attn,#{?synchronize-panes,fg=$c_alert,fg=$c_window}}"
set -g display-panes-colour "$bg2"
set -g display-panes-active-colour "$c_window"

set -g message-style "fg=$fg,bg=$bg1"
set -g message-command-style "fg=$c_attn,bg=$bg1"
setw -g mode-style "fg=$fg,bg=$bg2"
setw -g clock-mode-colour "$c_window"

setw -g pane-scrollbars modal
setw -g pane-scrollbars-style "bg=$bg1,fg=$gray,width=1"

set -g popup-border-lines rounded
set -g popup-border-style "fg=$c_window"
set -g menu-border-lines rounded
set -g menu-border-style "fg=$c_window"
set -g menu-selected-style "fg=$pill_fg,bg=$c_window"

# -- plugins -------------------------------------------------------------------

set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @continuum-restore 'on'

run '~/.config/tmux/plugins/tpm/tpm'
